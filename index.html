<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Pokédex</h1>
        <p>Digite o nome de um Pokémon que deseja procurar</p>
        
        <div class="busca">
            <input type="text" id="campo-busca" placeholder="Digite o nome do Pokémon...">
            <button id="botao-buscar">Buscar</button>
        </div>

        <div id="resultado" class="resultado-area">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
